<svg width="880" height="132" viewBox="0 0 880 132" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="omnireach — Search and read the login-walled Chinese internet for AI agents — WeChat, Xiaohongshu, Douyin and Bilibili, plus Twitter, Reddit, HackerNews and RSS. An MCP server and a CLI, driven through your own logged-in browser.">
