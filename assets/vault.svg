<svg width="880" height="210" viewBox="0 0 880 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="access granted — nothing of value here, the real work ships in daylight. curiosity acknowledged, operator.">
  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .big { font-size: 27px; font-weight: 700; letter-spacing: 6px; fill: #E6EDF3; }
    .sub { font-size: 12px; fill: #8B949E; }
    .dim { fill: #58636F; }
    .hex { font-size: 10px; fill: #232C38; }

    .gate { transform: scaleX(0); transform-origin: 0 0; animation: gate 0.9s steps(24) 0.2s both; }
    @keyframes gate { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .rev  { animation: appear 0.15s linear 1.25s both; }
    .rev2 { animation: appear 0.15s linear 1.7s both; }
    .rev3 { animation: appear 0.15s linear 2.1s both; }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    .gl { opacity: 0; }
    .gl1 { animation: glitch 5s steps(1) 2.6s infinite; }
    .gl2 { animation: glitch 5s steps(1) 2.64s infinite; }
    @keyframes glitch { 0%,30.9%,32.6%,33.4%,34.6%,100% { opacity: 0; } 31%,32.5% { opacity: 0.6; } 33.5%,34.5% { opacity: 0.35; } }

    .scrollcol { animation: colup 12s linear infinite; }
    @keyframes colup { from { transform: translateY(0); } to { transform: translateY(-224px); } }

    .cursor { animation: appear 0.1s linear 2.3s both, blink 1.1s steps(1) 2.4s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

