      <stop offset="0.5" stop-color="#E6EDF3" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="431" height="131" rx="8" fill="#0A0D12"/>
