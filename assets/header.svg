<svg width="880" height="248" viewBox="0 0 880 248" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="e0_7 fleet console — building tools and infrastructure for AI agents">
  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .cmd  { font-size: 13.5px; fill: #E6EDF3; }
    .dollar { fill: #F5A63B; }
    .resp { font-size: 13.5px; fill: #8B949E; }
    .hi   { fill: #E6EDF3; }
    .amber{ fill: #F5A63B; }
    .green{ fill: #4CC38A; }
    .dim  { fill: #58636F; }
    .title{ font-size: 12px; fill: #7D8590; letter-spacing: 0.5px; }
    .lbl  { font-size: 10.5px; fill: #58636F; letter-spacing: 0.5px; }

    /* typing reveal: clip rects scale open in character steps */
    .tw { transform: scaleX(0); transform-origin: 0 0; }
    #t1 { animation: open 0.65s steps(8)  0.5s both; }
    #t2 { animation: open 0.80s steps(10) 2.3s both; }
    #t3 { animation: open 1.00s steps(14) 4.4s both; }
    @keyframes open { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .r1 { animation: appear 0.12s linear 1.45s both; }
    .r2 { animation: appear 0.12s linear 3.45s both; }
    .r3 { animation: appear 0.12s linear 5.75s both; }
    .p4 { animation: appear 0.12s linear 6.3s both; }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    .cursor { animation: appear 0.1s linear 6.3s both, blink 1.1s steps(1) 6.4s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

    .halo { transform-origin: 688px 138px; animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.45); opacity: 0.1; } }
    .n1 { animation: nodepulse 2.8s ease-in-out 0.0s infinite; }
    .n2 { animation: nodepulse 2.8s ease-in-out 0.4s infinite; }
    .n3 { animation: nodepulse 2.8s ease-in-out 0.8s infinite; }
    .n4 { animation: nodepulse 2.8s ease-in-out 1.2s infinite; }
    .n5 { animation: nodepulse 2.8s ease-in-out 1.6s infinite; }
    .n6 { animation: nodepulse 2.8s ease-in-out 2.0s infinite; }
    @keyframes nodepulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pkt { display: none; }
    }
  </style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E6EDF3" opacity="0.028"/>
    </pattern>
    <clipPath id="c1"><rect id="t1" class="tw" x="36" y="60" width="76" height="18"/></clipPath>
    <clipPath id="c2"><rect id="t2" class="tw" x="36" y="108" width="92" height="18"/></clipPath>
    <clipPath id="c3"><rect id="t3" class="tw" x="36" y="156" width="126" height="18"/></clipPath>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="879" height="247" rx="10" fill="#0A0D12"/>
  <rect x="0.5" y="0.5" width="879" height="247" rx="10" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="879" height="247" rx="10" stroke="#1C232E"/>

  <!-- title bar -->
  <line x1="1" y1="34.5" x2="879" y2="34.5" stroke="#161C25"/>
  <circle cx="24" cy="17.5" r="4.5" fill="#242D39"/>
  <circle cx="42" cy="17.5" r="4.5" fill="#242D39"/>
  <circle cx="60" cy="17.5" r="4.5" fill="#F5A63B" opacity="0.85"/>
  <text class="mono title" x="440" y="21.5" text-anchor="middle">e0_7@daily-ac : ~ / fleet-console</text>
  <text class="mono lbl" x="856" y="21.5" text-anchor="end"><tspan class="green">●</tspan> live</text>

  <!-- session -->
  <g clip-path="url(#c1)">
    <text class="mono cmd" x="36" y="74"><tspan class="dollar">$</tspan> whoami</text>
  </g>
  <text class="mono resp r1" x="36" y="98">e0_7 <tspan class="dim">·</tspan> I build <tspan class="hi">tools and infrastructure for AI agents</tspan></text>

  <g clip-path="url(#c2)">
    <text class="mono cmd" x="36" y="122"><tspan class="dollar">$</tspan> cat motd</text>
  </g>
  <text class="mono resp r2" x="36" y="146">ship small sharp tools <tspan class="dim">·</tspan> let agents do real work</text>

  <g clip-path="url(#c3)">
    <text class="mono cmd" x="36" y="170"><tspan class="dollar">$</tspan> fleet status</text>
  </g>
  <text class="mono resp r3" x="36" y="194"><tspan class="green">●</tspan> relay  <tspan class="green">●</tspan> swarm ×6  <tspan class="green">●</tspan> watchdog  <tspan class="dim">—</tspan> all nominal</text>

  <text class="mono cmd p4" x="36" y="222"><tspan class="dollar">$</tspan></text>
  <rect class="cursor" x="54" y="210" width="8" height="15" fill="#F5A63B"/>

  <!-- fleet graph -->
  <g>
    <circle cx="688" cy="138" r="64" stroke="#1C232E" stroke-dasharray="2 5" fill="none"/>
    <!-- edges -->
    <g stroke="#222B38" stroke-width="1">
      <path id="e1" d="M688 138 L752 138"/>
      <path id="e2" d="M688 138 L720 193"/>
      <path id="e3" d="M688 138 L656 193"/>
      <path id="e4" d="M688 138 L624 138"/>
      <path id="e5" d="M688 138 L656 83"/>
      <path id="e6" d="M688 138 L720 83"/>
    </g>
    <!-- packets -->
    <g class="pkt" fill="#F5A63B">
      <circle r="1.8" opacity="0.9"><animateMotion dur="2.6s" begin="0s"    repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="1.8" opacity="0.9"><animateMotion dur="2.6s" begin="0.9s"  repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      <circle r="1.8" opacity="0.9"><animateMotion dur="2.6s" begin="1.7s"  repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
      <circle r="1.8" opacity="0.7" fill="#4CC38A"><animateMotion dur="3.1s" begin="0.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e2"/></animateMotion></circle>
      <circle r="1.8" opacity="0.7" fill="#4CC38A"><animateMotion dur="3.1s" begin="1.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e4"/></animateMotion></circle>
      <circle r="1.8" opacity="0.7" fill="#4CC38A"><animateMotion dur="3.1s" begin="2.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e6"/></animateMotion></circle>
    </g>
    <!-- nodes -->
    <g fill="#39434F">
      <circle class="n1" cx="752" cy="138" r="3.5"/>
      <circle class="n2" cx="720" cy="193" r="3.5"/>
      <circle class="n3" cx="656" cy="193" r="3.5"/>
      <circle class="n4" cx="624" cy="138" r="3.5"/>
      <circle class="n5" cx="656" cy="83"  r="3.5"/>
      <circle class="n6" cx="720" cy="83"  r="3.5"/>
    </g>
    <g class="mono lbl">
      <text x="762" y="142" text-anchor="start">relay</text>
      <text x="726" y="207" text-anchor="middle">cli</text>
      <text x="652" y="207" text-anchor="middle">mcp</text>
      <text x="614" y="142" text-anchor="end">voice</text>
      <text x="652" y="72"  text-anchor="middle">worlds</text>
      <text x="726" y="72"  text-anchor="middle">infra</text>
    </g>
    <!-- center -->
    <circle class="halo" cx="688" cy="138" r="11" stroke="#F5A63B" fill="none" opacity="0.55"/>
    <rect x="682" y="132" width="12" height="12" fill="#F5A63B" transform="rotate(45 688 138)"/>
  </g>
</svg>
